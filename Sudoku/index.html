<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku 4×4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f3ecd9;
    --paper-dark: #e9dfc4;
    --ink: #232c3d;
    --ink-soft: #5a6478;
    --brass: #b3862f;
    --brass-dark: #8a6521;
    --error: #b4432f;
    --success: #4f7a5a;
    --cell: #fbf7ec;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Inter', sans-serif;
    padding: 24px;
  }

  #game {
    display: flex;
    flex-direction: column;
    align-items: center;
    border-radius: 20px;
    position: relative;
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--brass-dark);
    font-weight: 600;
    margin-bottom: 6px;
  }

  h1 {
    margin: 0 0 22px;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.01em;
    color: var(--ink);
  }

  .board-frame {
    padding: 3px;
    border-radius: 12px;
    background: linear-gradient(155deg, var(--brass), var(--brass-dark));
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 62px);
    grid-template-rows: repeat(4, 62px);
    background: var(--brass-dark);
    gap: 1px;
    border-radius: 6px;
    overflow: hidden;
  }

  .cell {
    width: 62px;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 24px;
    font-weight: 700;
    background: var(--cell);
    color: var(--ink);
    cursor: pointer;
    user-select: none;
    transition: background 120ms ease, transform 80ms ease;
    position: relative;
  }

  .cell.given {
    color: var(--ink);
    background: #f1e9d4;
    cursor: default;
  }

  .cell.user-input { color: var(--brass-dark); 
font-family: 'Courier New', monospace; 
  font-style: italic;                   
  font-weight: 800;}

  .cell:not(.given):hover { background: #f4ede0; }

  .cell.selected {
    background: #fff3cf;
    box-shadow: inset 0 0 0 1px var(--brass);
    z-index: 2;
  }

  .cell.wrong {
    background: rgba(180,67,47,0.16);
    color: var(--error);
    animation: shake 260ms ease;
  }

  .cell.win-pulse { animation: pulse 520ms ease; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  @keyframes pulse {
    0% { background: var(--cell); }
    45% { background: rgba(79,122,90,0.35); }
    100% { background: var(--cell); }
  }

  /* box borders (2x2 blocks) */
  .cell:nth-child(2n) { border-right: 1px solid var(--brass-dark); }
  .cell:nth-child(4n) { border-right: none; }
  .cell:nth-child(n+9):nth-child(-n+12) { border-top: 2px solid var(--brass-dark); }

  .controls {
    margin-top: 22px;
    display: flex;
    gap: 10px;
  }

  .num-btn, .icon-btn {
    width: 48px;
    height: 48px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    border: none;
    border-radius: 9px;
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
    transition: transform 100ms ease, background 120ms ease;
  }

  .num-btn:hover, .icon-btn:hover { background: #34405a; transform: translateY(-2px); }
  .num-btn:active, .icon-btn:active { transform: translateY(0); }

  .icon-btn {
    background: transparent;
    color: var(--ink-soft);
    border: 1.5px solid rgba(35,44,61,0.25);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    width: auto;
    padding: 0 16px;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--ink); background: transparent; }

  .bottom-row {
    margin-top: 14px;
    display: flex;
    gap: 10px;
  }

  .diff-toggle {
    display: flex;
    border: 1.5px solid rgba(35,44,61,0.25);
    border-radius: 9px;
    overflow: hidden;
  }

  .diff-btn {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 0 16px;
    height: 40px;
    cursor: pointer;
  }

  .diff-btn:first-child { border-right: 1.5px solid rgba(35,44,61,0.25); }

  .diff-btn.active {
    background: var(--ink);
    color: var(--paper);
  }

  #message {
    margin-top: -10px;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--brass);
  }

  #message.ok { color: var(--success); }
  #message.bad { color: var(--error); }
  #message.win { color: var(--brass-dark); font-family: 'Fraunces', serif; font-size: 17px; }

  .hint {
    margin-top: 4px;
    font-size: 11px;
    color: var(--ink-soft);
    opacity: 0.7;
  }

  @media (max-width: 420px) {
    .grid { grid-template-columns: repeat(4, 52px); grid-template-rows: repeat(4, 52px); }
    .cell { width: 52px; height: 52px; font-size: 20px; }
    #game { padding: 26px 20px 24px; }
  }
</style>
</head>
<body>
  <div id="game">
    <div class="eyebrow" id="diffLabel">Hard</div>
    <h1>Sudoku 4×4</h1>
    <p id="message"></p>

    <div class="board-frame">
      <div class="grid" id="grid"></div>
    </div>

    <div class="controls" id="numberControls">
      <button class="num-btn" data-num="1">1</button>
      <button class="num-btn" data-num="2">2</button>
      <button class="num-btn" data-num="3">3</button>
      <button class="num-btn" data-num="4">4</button>
    </div>

    <div class="bottom-row">
      <div class="diff-toggle" id="diffToggle">
        <button class="diff-btn" data-diff="easy">Easy</button>
        <button class="diff-btn" data-diff="hard">Hard</button>
      </div>
    </div>

    <div class="bottom-row">
      <button class="icon-btn" id="restartBtn">Restart</button>
    </div>
  </div>

<script>
(() => {
  const gridEl = document.getElementById('grid');
  const messageEl = document.getElementById('message');
  const diffLabelEl = document.getElementById('diffLabel');
  let selectedIndex = null, puzzle = [], solution = [], given = [], difficulty = 'hard';

  const BOARDS = {
    hard: {
      solution: [1,2,3,4, 3,4,1,2, 2,1,4,3, 4,3,2,1]
    },
    easy: {
      solution: [4,1,2,3, 2,3,4,1, 1,4,3,2, 3,2,1,4]
    }
  };

  function randomMask(size, count) {
    const mask = Array(size).fill(0);
    let chosen = 0;
    while (chosen < count) {
      const idx = Math.floor(Math.random() * size);
      if (mask[idx] === 0) {
        mask[idx] = 1;
        chosen++;
      }
    }
    return mask;
  }

  function loadBoard() {
  const board = BOARDS[difficulty];
  solution = [...board.solution];

  const clueCount = difficulty === 'hard' ? 4 : 6;
  const givenMask = randomMask(solution.length, clueCount);

  given = givenMask.map(v => v === 1);
  puzzle = solution.map((num,i)=> given[i] ? num : '');
}

  function render() {
    gridEl.innerHTML = '';
    selectedIndex = null;
    messageEl.textContent = '';
    puzzle.forEach((num,i) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.index = i;
      cell.textContent = num || '';
      if (given[i]) cell.classList.add('given');
      if (num && !given[i]) cell.classList.add('user-input');
      cell.onclick = () => selectCell(i);
      gridEl.appendChild(cell);
    });
  }

  function selectCell(i) {
    if (selectedIndex !== null) gridEl.children[selectedIndex].classList.remove('selected');
    selectedIndex = i;
    gridEl.children[i].classList.add('selected');
  }

  function setMessage(text, cls='') {
    messageEl.textContent = text;
    messageEl.className = cls;
  }

  function placeNumber(num) {
    if (selectedIndex === null) return setMessage('Select a cell first');
    const i = selectedIndex, cell = gridEl.children[i];
    puzzle[i] = num;
    cell.textContent = num;
    cell.classList.remove('wrong','selected');
    cell.classList.add('user-input');
    selectedIndex = null;

    if (num !== solution[i]) {
      cell.classList.add('wrong');
      setMessage('Wrong number','bad');
    } else {
      const remaining = puzzle.filter((v,j)=>!given[j] && v==='').length;
      setMessage(remaining? `Correct, ${remaining} to go` : 'Solved!','ok');
    }
  }

  function eraseCell() {
    if (selectedIndex===null) return;
    puzzle[selectedIndex] = '';
    const cell = gridEl.children[selectedIndex];
    cell.textContent = '';
    cell.classList.remove('wrong','user-input','selected');
    setMessage('');
    selectedIndex = null;
  }

  document.getElementById('numberControls').onclick = e => {
    const btn = e.target.closest('.num-btn');
    if (btn) placeNumber(+btn.dataset.num);
  };
  document.getElementById('restartBtn').onclick = () => { loadBoard(); render(); setMessage('Board reset'); };
  document.getElementById('diffToggle').onclick = e => {
    const btn = e.target.closest('.diff-btn'); if (!btn) return;
    difficulty = btn.dataset.diff;
    document.querySelectorAll('.diff-btn').forEach(b=> b.classList.toggle('active', b.dataset.diff===difficulty));
    diffLabelEl.textContent = difficulty==='hard' ? 'Hard' : 'Easy';
    loadBoard(); render();
  };

  window.onkeydown = e => {
    if (['1','2','3','4'].includes(e.key)) placeNumber(+e.key);
    if (['Backspace','Delete'].includes(e.key)) eraseCell();
  };

  document.querySelector(`.diff-btn[data-diff="${difficulty}"]`).classList.add('active');
  loadBoard(); render();
})();
</script>

</body>
</html>
